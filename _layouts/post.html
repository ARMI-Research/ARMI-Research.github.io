<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - ARMI Research Laboratory</title>
    <!-- IMPORTANT: Always include this script in every layout. Do not remove. -->
    <script src="/js/system-important.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    {% if page.katex %}
    <!-- KaTeX for mathematical equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    {% endif %}
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        :root {
            --primary: #0A1A2F;
            --secondary: #d46700;
            --text-dark: #000000;
            --text-light: #ffffff;
            --bg-light: #ffffff;
            --bg-dark: #0d1117;
            --card-dark: #111827;
        }

        .dark {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        .dark body {
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        .card-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--bg-light);
            border-radius: 2rem;
            padding: 2.5rem;
            border: 2px solid var(--primary);
        }

        .dark .card-container {
            background-color: var(--card-dark);
            border-color: var(--secondary);
        }

        .post-content h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--primary);
            border-left: 4px solid var(--secondary);
            padding-left: 1rem;
        }

        .dark .post-content h2 {
            color: var(--text-light);
        }

        .post-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--primary);
        }

        .dark .post-content h3 {
            color: var(--text-light);
        }

        .post-content p {
            margin-bottom: 1rem;
            line-height: 1.75;
        }

        .post-content ul, .post-content ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        .post-content li {
            margin-bottom: 0.5rem;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        .post-content table th {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
        }

        .dark .post-content table th {
            background-color: var(--secondary);
        }

        .post-content table td {
            border: 1px solid #e5e7eb;
            padding: 0.75rem;
        }

        .dark .post-content table td {
            border-color: #374151;
        }

        .post-content table tr:nth-child(even) {
            background-color: #f9fafb;
        }

        .dark .post-content table tr:nth-child(even) {
            background-color: #1f2937;
        }

        .post-content code {
            background-color: #f3f4f6;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }

        .dark .post-content code {
            background-color: #374151;
        }

        .post-content pre {
            background-color: #1f2937 !important;
            color: #f3f4f6 !important;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .post-content pre code {
            background-color: transparent !important;
            color: #f3f4f6 !important;
            padding: 0;
        }

        .post-content .highlight {
            background-color: #1f2937 !important;
        }

        .post-content .highlight pre {
            background-color: #1f2937 !important;
        }

        .post-content .highlight code {
            color: #f3f4f6 !important;
        }

        .post-content blockquote {
            border-left: 4px solid var(--secondary);
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: #6b7280;
        }

        .dark .post-content blockquote {
            color: #9ca3af;
        }

        .post-content hr {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 2rem 0;
        }

        .dark .post-content hr {
            border-top-color: #374151;
        }

        .post-content strong {
            font-weight: 600;
            color: var(--primary);
        }

        .dark .post-content strong {
            color: var(--secondary);
        }

        .post-content a {
            color: var(--secondary);
            text-decoration: underline;
        }

        .post-content a:hover {
            color: var(--primary);
        }

        .dark .post-content a:hover {
            color: var(--text-light);
        }
    </style>

    <!-- Apply saved theme immediately to prevent flash -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0A1A2F',
                        secondary: '#e97509',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-200">

    <div id="hoverZone" class="fixed top-0 left-0 w-full h-6 z-40"></div>

    <header id="mainHeader" class="fixed top-0 left-0 w-full z-50 transition-transform duration-300 ease-in-out bg-gradient-to-b from-white to-gray-100 dark:from-gray-900 dark:to-black shadow-md">
        <div class="relative w-full border-b-4 border-gray-500 dark:border-orange-600">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2 sm:py-4 relative flex items-center justify-between">
                <div class="flex gap-1 sm:gap-3">
                    <a href="/lab/">
                        <div class="px-3 py-1 sm:px-6 sm:py-2 bg-white border-2 rounded-lg border-gray-400 text-center text-sm sm:text-lg font-semibold shadow-sm transition-all duration-200 hover:bg-secondary hover:border-orange-500 hover:text-white dark:bg-gray-800 dark:text-white dark:border-orange-500 dark:hover:bg-secondary">Lab</div>
                    </a>
                    <a href="/blog/">
                        <div class="px-3 py-1 sm:px-6 sm:py-2 bg-white border-2 rounded-lg border-gray-400 text-center text-sm sm:text-lg font-semibold shadow-sm transition-all duration-200 hover:bg-secondary hover:border-orange-500 hover:text-white dark:bg-gray-800 dark:text-white dark:border-orange-500 dark:hover:bg-secondary">Blog</div>
                    </a>
                </div>
                <div class="absolute left-1/2 transform -translate-x-1/2 flex items-center gap-2 sm:gap-4">
                    <img src="/images/logo.png" class="w-10 h-9 sm:w-16 sm:h-14 object-contain dark:brightness-90">
                    <a href="/">
                        <h1 class="text-xl sm:text-3xl font-bold text-gray-900 dark:text-white hover:text-orange-500 dark:hover:text-orange-500 transition-colors">ARMI Lab</h1>
                    </a>
                </div>
                <div class="text-gray-700 dark:text-gray-300 leading-tight">
                    <div class="flex flex-col items-center sm:hidden text-xs font-bold gap-0.5">
                        <span class="text-orange-600 dark:text-orange-500">A</span>
                        <span class="text-orange-600 dark:text-orange-500">R</span>
                        <span class="text-orange-600 dark:text-orange-500">M</span>
                        <span class="text-orange-600 dark:text-orange-500">I</span>
                    </div>
                    <div class="hidden sm:block text-sm">
                        <div class="font-medium"><span class="text-orange-600 dark:text-orange-500 font-bold">A</span>utonomous</div>
                        <div class="font-medium"><span class="text-orange-600 dark:text-orange-500 font-bold">R</span>obotics</div>
                        <div class="font-medium"><span class="text-orange-600 dark:text-orange-500 font-bold">M</span>achine</div>
                        <div class="font-medium"><span class="text-orange-600 dark:text-orange-500 font-bold">I</span>ntelligence</div>
                        <div class="text-xs text-gray-600 dark:text-gray-400 mt-1">Research Laboratory</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="card-container shadow-2xl lg:p-12 transition duration-500 mt-20 sm:mt-40">

        <h1 class="text-4xl font-bold mb-4 text-gray-800 dark:text-gray-100">{{ page.title }}</h1>

        <div class="text-sm text-gray-600 dark:text-gray-400 mb-2">
            {{ page.date | date: "%B %d, %Y" }}
        </div>

        {% if page.tags %}
        <div class="flex gap-2 mb-6">
            {% for tag in page.tags %}
            <a href="/blog/?tag={{ tag | downcase | url_encode }}" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm rounded-full hover:bg-secondary hover:text-white dark:hover:bg-orange-500 dark:hover:text-white active:scale-95 transition-all cursor-pointer no-underline">
                {{ tag }}
            </a>
            {% endfor %}
        </div>
        {% endif %}

        <hr class="mb-8 border-gray-300 dark:border-gray-700">

        <div style="margin-bottom: 2rem;">
            <a href="/blog/" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background-color: #e97509; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: 600; transition: all 0.3s;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Back
            </a>
        </div>

        <div class="post-content">
            {{ content }}
        </div>

    </div>

    <!-- Header scroll behavior -->
    <script>
        const header = document.getElementById("mainHeader");
        const hoverZone = document.getElementById("hoverZone");
        let lastScroll = 0;

        window.addEventListener("scroll", () => {
            const currentScroll = window.pageYOffset;

            if (currentScroll > lastScroll && currentScroll > 100) {
                header.classList.add("-translate-y-full");
            } else {
                header.classList.remove("-translate-y-full");
            }

            lastScroll = currentScroll;
        });

        hoverZone.addEventListener("mouseenter", () => {
            header.classList.remove("-translate-y-full");
        });

        {% if page.katex %}
        // Render KaTeX
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false}
                ]
            });
        });
        {% endif %}
    </script>

    <!-- Theme Toggle -->
    <button onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light')"
        class="fixed bottom-4 right-4 bg-white text-black p-3 border-4 border-gray-400 rounded-full shadow-lg text-sm font-semibold hover:bg-secondary transition-colors duration-300 dark:bg-gray-800 dark:text-white dark:border-orange-600 dark:hover:bg-secondary">
        Toggle Theme
    </button>

</body>

</html>
